services:
  redis:
    image: redis:7-alpine
    # No host port — app talks to Redis only via SRH on 8079.

  srh:
    image: hiett/serverless-redis-http:latest
    ports:
      - "8079:80"
    environment:
      SRH_MODE: env
      SRH_TOKEN: local_dev_token
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      - redis
